- name: Set up Java 17
  uses: actions/setup-java@v4
  with:
    java-version: '17'
    distribution: 'temurin'

- name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    api-level: 35
    build-tools: "35.0.0"
    accept-licenses: true

- name: Set up Gradle
  uses: gradle/actions/setup-gradle@v3
  
